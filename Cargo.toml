[workspace]
members = ["xtask"]

[workspace.package]
edition = "2024"
authors = ["Samuel Parkinson <samuel.parkinson@hey.com>"]
repository = "https://github.com/sjparkinson/wurkkos-ts21"
license = "MIT"

[workspace.lints.rust]
# Only src/hw.rs, src/rt.rs, the #[unsafe(no_mangle)] on main and the no_mangle
# items in src/bin/link_probe.rs may opt back in.
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"

[package]
name = "ts21"
description = "Firmware for the Wurkkos TS21 torch."
readme = "README.md"
edition.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
# So a bare `cargo run` reaches the host stub's pointer to `cargo xtask hex`.
default-run = "wurkkos-ts21-0614"

[features]
# The fake ADC and reading helpers in src/testing.rs, for xtask's
# simulators. Never on in the firmware.
testing = []

# Named after the model, like the hex, so the ELF is wurkkos-ts21-0614.elf.
[[bin]]
name = "wurkkos-ts21-0614"
path = "src/main.rs"
test = false
bench = false

# Checks link.x and src/rt.rs with real statics. Never flashed.
[[bin]]
name = "link-probe"
path = "src/bin/link_probe.rs"
test = false
bench = false

[lints]
workspace = true

# Panics can't unwind on AVR. Size beats speed on 16 KB of flash, and debug
# info only lands in the ELF, never in the hex.
[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
debug = true

[profile.dev]
panic = "abort"
opt-level = "s"
