name: ci

on:
  push:
    branches:
      - main
  pull_request: ~

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Turns rustc, clippy, rustfmt, test panic and rust-lld errors in the
      # log into annotations on the PR diff.
      - run: echo "::add-matcher::.github/rust-matchers.json"

      # rustup reads rust-toolchain.toml and installs the pinned nightly,
      # with rust-src, rustfmt and clippy, the first time cargo runs.
      - run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}-

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo fw-clippy
      - run: cargo xtask size
      - run: cargo xtask hex

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wurkkos-ts21-0614
          path: |
            target/wurkkos-ts21-0614.hex
            target/avr-none/release/wurkkos-ts21-0614.elf

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: wurkkos-ts21-0614
          path: dist

      - run: |
          version="0.1.$(git rev-list --count HEAD)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mv dist/wurkkos-ts21-0614.hex "dist/wurkkos-ts21-0614-$version.hex"
          mv dist/avr-none/release/wurkkos-ts21-0614.elf "dist/wurkkos-ts21-0614-$version.elf"

      - uses: actions/attest@v4.2.2
        with:
          subject-path: dist/wurkkos-ts21-0614-*

      - run: |
          gh release create "v$VERSION" dist/wurkkos-ts21-0614-* \
            --target "$GITHUB_SHA" \
            --title "$VERSION+$(git rev-parse --short HEAD)" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
