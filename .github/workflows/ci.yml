name: ci

on:
  push:
    branches:
      - main
  pull_request: ~

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: test
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - run: echo "::add-matcher::.github/rust-matchers.json"

      - run: rustup show active-toolchain || rustup toolchain install

      - uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}-${{ github.sha }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}-

      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo clippy --package ts21 --release --target avr-none -Zbuild-std=core -- -D warnings
      - run: cargo xtask hex

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: wurkkos-ts21-0614
          path: |
            target/avr-none/release/wurkkos-ts21-0614.elf
            target/wurkkos-ts21-0614.hex

  release:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-slim
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@v8.0.2
        with:
          name: wurkkos-ts21-0614
          path: dist

      - run: |
          version="0.1.$(git rev-list --count HEAD)"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mv dist/wurkkos-ts21-0614.hex "dist/wurkkos-ts21-0614-$version.hex"
          mv dist/avr-none/release/wurkkos-ts21-0614.elf "dist/wurkkos-ts21-0614-$version.elf"

      - uses: actions/attest@v4.2.2
        with:
          subject-path: dist/wurkkos-ts21-0614-*

      - name: release notes
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## Flash

          From a checkout of this repo:

          \`\`\`sh
          gh release download v$VERSION -R $GITHUB_REPOSITORY -p wurkkos-ts21-0614-$VERSION.hex
          gh attestation verify wurkkos-ts21-0614-$VERSION.hex -R $GITHUB_REPOSITORY
          cargo xtask flash /dev/cu.usbserial-XXXX wurkkos-ts21-0614-$VERSION.hex
          \`\`\`

          See [docs/flashing.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_SHA/docs/flashing.md) for information on programmers, and pad order.

          EOF

      - name: gh release
        run: |
          gh release create "v$VERSION" dist/wurkkos-ts21-0614-* \
            --target "$GITHUB_SHA" \
            --title "$VERSION+$(git rev-parse --short HEAD)" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --generate-notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
